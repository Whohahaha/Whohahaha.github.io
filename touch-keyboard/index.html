:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --key:#e4eaef; --panel:rgba(22,29,35,.95); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--glass);color:var(--fg);font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{touch-action:manipulation}
#bar{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

#barMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#modeLabel{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
#prompt{font-size:20px;line-height:1.35;min-height:27px;text-wrap:balance}
#prompt .done{color:var(--muted)}
#prompt .cur{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 2px}
#prompt .ok{color:var(--good)} #prompt .miss{color:var(--warn)}
#out{font-family:var(--f-mono);font-size:20px;line-height:1.35;min-height:27px;white-space:pre-wrap;word-break:break-word;max-height:4.2em;overflow:hidden}

#out .caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#barBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#native{display:flex;gap:8px;margin-top:4px}
#nativeInput{flex:1;min-width:0;font:inherit;font-size:20px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--glass);color:var(--fg);-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--fg);color:var(--glass);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#sheet{position:fixed;inset:0;z-index:8;background:rgba(10,15,20,.35);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheetCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:88%;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px;-webkit-user-select:text;user-select:text;touch-action:pan-y}
#sheetCard h1{font-size:22px;margin:0}
#sheetCard h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
#sheetCard p{margin:0;line-height:1.55;color:var(--muted);max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 14px}
.tile b{font-size:16px} .tile span{font-size:13px;color:var(--muted);line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.lbl{min-width:96px;font-size:14px}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.tablewrap{overflow-x:auto}

.note{font-size:13px;color:var(--muted);line-height:1.5}

}
const avg=(a,i)=>a.reduce((s,p)=>s+p[i],0)/a.length;
const variance=(a,i)=>{if(a.length<2)return 0;const m=avg(a,i);return a.reduce((s,p)=>s+(p[i]-m)**2,0)/(a.length-1)};

// 根据校准样本拟合个人映射
function fitProfile(home,thumbs,samples){
  const g=geomModel(home,thumbs);const p=g.pitch;
  const nearestSpace=(x)=>g.keys.filter(k=>k.ch===' ').sort((a,b)=>Math.abs(a.mu[0]-x)-Math.abs(b.mu[0]-x))[0];
  const keyOf=s=>s.ch===' '?nearestSpace(s.x):g.keys.find(k=>k.ch===s.ch);
  // 1) 整手平均偏差（剔除离谱点）
  const res={L:[0,0,0],R:[0,0,0]};const good=[];let dropped=0;
  for(const s of samples){const k=keyOf(s);if(!k)continue;const dx=s.x-k.mu[0],dy=s.y-k.mu[1];
    const lim=k.ch===' '?3*p:1.3*p;if(Math.hypot(dx,dy)>lim){dropped++;continue}
    good.push({s,k});if(k.ch!==' '){res[k.hand][0]+=dx;res[k.hand][1]+=dy;res[k.hand][2]++}}
  const hOff={L:res.L[2]?[res.L[0]/res.L[2],res.L[1]/res.L[2]]:[0,0],R:res.R[2]?[res.R[0]/res.R[2],res.R[1]/res.R[2]]:[0,0]};
  // 2) 每键均值（向几何预测收缩）
  const by=new Map();good.forEach(({s,k})=>{if(!by.has(k))by.set(k,[]);by.get(k).push([s.x,s.y])});
  const K0=1;
  for(const k of g.keys){const pts=by.get(k)||[];
    if(k.ch===' '){if(pts.length){const all=pts;k.mu=[avg(all,0),avg(all,1)];k.cov=[Math.max(variance(all,0),(0.9*p)**2),0,Math.max(variance(all,1),(0.4*p)**2)]}continue}
    const prior=[k.mu[0]+hOff[k.hand][0],k.mu[1]+hOff[k.hand][1]];
    const n=pts.length;k.n=n;
    k.mu=[(pts.reduce((a,q)=>a+q[0],0)+K0*prior[0])/(n+K0),(pts.reduce((a,q)=>a+q[1],0)+K0*prior[1])/(n+K0)];
  }
  // 3) 合并方差
  let ss=0,df=0;for(const k of g.keys){if(k.ch===' ')continue;const pts=by.get(k)||[];if(pts.length<2)continue;const mx=avg(pts,0),my=avg(pts,1);pts.forEach(q=>ss+=(q[0]-mx)**2+(q[1]-my)**2);df+=2*(pts.length-1)}
  let sig=df?Math.sqrt(ss/df):0.4*p;sig=Math.min(Math.max(sig,0.22*p),0.6*p);
  for(const k of g.keys){if(k.ch===' ')continue;const pts=by.get(k)||[];const s2=sig*sig;
    if(pts.length>=4){const mx=avg(pts,0),my=avg(pts,1);let a=0,b=0,c=0;pts.forEach(q=>{a+=(q[0]-mx)**2;b+=(q[0]-mx)*(q[1]-my);c+=(q[1]-my)**2});const n=pts.length-1,w=4;
      k.cov=[(a+w*s2)/(n+w),b/(n+w),(c+w*s2)/(n+w)]}else k.cov=[s2,0,s2]}
  return {pitch:p,keys:g.keys.map(k=>({ch:k.ch,hand:k.hand,mu:k.mu,cov:k.cov,n:k.n||0})),sigma:sig,dropped,used:good.length,hOff};
}

// ---------- 运行时模型 ----------
let profile=null;   // 当前方向的校准档案
let model=null;     // {pitch, keys:[{ch,hand,mu,mu0,cov,inv,ld}], off:{L,R}}
const orientKey=()=>innerWidth>=innerHeight?'landscape':'portrait';
function loadProfile(){profile=store.get('tkb.profile.'+orientKey(),null);model=profile?buildModel(profile):null}
function buildModel(pr){
  const keys=pr.keys.map(k=>{const mu=(pr.learned&&pr.learned[k.ch+k.hand])||k.mu;const m={ch:k.ch,hand:k.hand,mu:[...mu],mu0:[...k.mu],cov:k.cov};prepCov(m);return m});
  return {pitch:pr.pitch,keys,off:{L:[0,0],R:[0,0]}};
}
function prepCov(k){const [a,b,c]=k.cov;const det=a*c-b*b;k.inv=[c/det,-b/det,a/det];k.ld=0.5*Math.log(det)}
const keyPos=k=>[k.mu[0]+model.off[k.hand][0],k.mu[1]+model.off[k.hand][1]];
function classify(x,y){
  const ll={};
  for(const k of model.keys){const [mx,my]=keyPos(k);const dx=x-mx,dy=y-my;
    let m=dx*dx*k.inv[0]+2*dx*dy*k.inv[1]+dy*dy*k.inv[2];m=Math.min(m,30);
    const v=-0.5*m-k.ld;if(ll[k.ch]===undefined||v>ll[k.ch])ll[k.ch]=v}
  let best=null,bs=-Infinity;for(const c in ll){const s=ll[c]+0.5*(CHAR_LP[c]??-6);if(s>bs){bs=s;best=c}}
  // 后验（用于无解码时的置信度）
  let Z=0;for(const c in ll)Z+=Math.exp(ll[c]+0.5*(CHAR_LP[c]??-6)-bs);
  return {ll,best,post:1/Z};
}
function saveLearned(){if(!profile||!model)return;profile.learned={};model.keys.forEach(k=>profile.learned[k.ch+k.hand]=k.mu);store.set('tkb.profile.'+orientKey(),profile)}

// 只用高置信度、且之后没被删改的词做缓慢跟随
const FOLLOW={hand:0.25,key:0.05,keyMax:0.5,offMax:2.0};
function learnWord(w){
  if(!settings.follow||!model||w.edited||w.conf<0.9||w.word.length<2||!WORDLP.has(w.word.replace(/[,.]$/,'')))return false;
  const pairs=[];
  w.touches.forEach((t,i)=>{const ch=w.word[i];const k=model.keys.find(k=>k.ch===ch);if(k)pairs.push([t,k])});
  if(w.space){const sk=model.keys.filter(k=>k.ch===' ').sort((a,b)=>Math.abs(keyPos(a)[0]-w.space.x)-Math.abs(keyPos(b)[0]-w.space.x))[0];if(sk)pairs.push([w.space,sk])}
  const p=model.pitch;
  for(const h of ['L','R']){const hp=pairs.filter(([t,k])=>k.hand===h&&k.ch!==' ');if(!hp.length)continue;
    let rx=0,ry=0;hp.forEach(([t,k])=>{const q=keyPos(k);rx+=t.x-q[0];ry+=t.y-q[1]});rx/=hp.length;ry/=hp.length;
    const o=model.off[h];o[0]+=FOLLOW.hand*rx;o[1]+=FOLLOW.hand*ry;const L=Math.hypot(o[0],o[1]),M=FOLLOW.offMax*p;if(L>M){o[0]*=M/L;o[1]*=M/L}}
  for(const [t,k] of pairs){const o=model.off[k.hand];k.mu[0]+=FOLLOW.key*(t.x-o[0]-k.mu[0]);k.mu[1]+=FOLLOW.key*(t.y-o[1]-k.mu[1]);
    const dx=k.mu[0]-k.mu0[0],dy=k.mu[1]-k.mu0[1],L=Math.hypot(dx,dy),M=FOLLOW.keyMax*p;if(L>M){k.mu[0]=k.mu0[0]+dx*M/L;k.mu[1]=k.mu0[1]+dy*M/L}}
  stats.learned++;return true;
}

// 八指（或单手四指）同时按住 → 重新对位
function reanchor(points){
  const homeC=h=>{const ks=model.keys.filter(k=>(h==='L'?HOME_L:HOME_R).includes(k.ch));return [avg(ks.map(keyPos),0),avg(ks.map(keyPos),1)]};
  const cL=homeC('L'),cR=homeC('R');const mid=(cL[0]+cR[0])/2;
  const res={};
  for(const h of ['L','R']){let g=points.filter(p=>h==='L'?p[0]<mid:p[0]>=mid);
    if(g.length>4)g=[...g].sort((a,b)=>a[1]-b[1]).slice(0,4); // 去掉最低的拇指
    if(g.length!==4)continue;
    const ks=(h==='L'?HOME_L:HOME_R).map(c=>model.keys.find(k=>k.ch===c));
    const m0=[avg(ks.map(k=>k.mu),0),avg(ks.map(k=>k.mu),1)];const c=[avg(g,0),avg(g,1)];
    const before=[...model.off[h]];model.off[h]=[c[0]-m0[0],c[1]-m0[1]];
    res[h]={shift:Math.hypot(model.off[h][0]-before[0],model.off[h][1]-before[1])};
  }
  return res;
}

// ---------- 解码 ----------
function decode(touches){
  const n=touches.length;let raw='',rawScore=0,rawConf=1;
  touches.forEach(t=>{raw+=t.raw;rawScore+=t.ll[t.raw]??-20;rawConf*=t.post});
  let tail='';let core=touches;
  if(n>1&&(raw.endsWith(',')||raw.endsWith('.'))){tail=raw.slice(-1);core=touches.slice(0,-1);raw=raw.slice(0,-1)}
  if(!settings.decode||settings.cond==='mapped-raw')return {word:raw+tail,raw:raw+tail,conf:rawConf,alts:[]};
  // 解码时只在字母里选：中间误判成标点/分号的落点也按最像的字母算
  const bestLetter=t=>{let b='e',v=-Infinity;for(const c of LETTERS){const x=t.ll[c];if(x!==undefined&&x>v){v=x;b=c}}return b};
  raw=core.map(t=>/[a-z]/.test(t.raw)?t.raw:bestLetter(t)).join('');
  const L=core.length;const cands=DICT[L]||[];
  const top=[];const push=(w,s)=>{top.push([w,s]);if(top.length>12){top.sort((a,b)=>b[1]-a[1]);top.length=8}};
  for(const [w,lp] of cands){let s=LM_W*lp;for(let i=0;i<L;i++){const v=core[i].ll[w[i]];s+=v===undefined?-20:v;if(s<-1e9)break}push(w,s)}
  if(!WORDLP.has(raw)){let s=LM_W*LP_OOV;core.forEach((t,i)=>s+=t.ll[raw[i]]??-20);push(raw,s)}
  top.sort((a,b)=>b[1]-a[1]);
  const b=top[0];let Z=0;top.forEach(x=>Z+=Math.exp(x[1]-b[1]));
  return {word:b[0]+tail,raw:raw+tail,conf:1/Z,alts:top.slice(1,4).map(x=>x[0])};
}

// ---------- 打字缓冲 ----------
const T={text:'',words:[],cur:[],ks:0,bks:0,first:null,last:null,taps:[]};
const stats={learned:0};
function resetTyping(){Object.assign(T,{text:'',words:[],cur:[],ks:0,bks:0,first:null,last:null,taps:[]})}
function stamp(t){if(T.first===null)T.first=t;T.last=t;T.ks++}
function typeTap(x,y,t){
  const r=classify(x,y);stamp(t);T.taps.push({x:Math.round(x),y:Math.round(y),t:Math.round(t),k:r.best});
  flashes.push({x,y,ch:r.best,t:performance.now()});
  if(r.best===' '){commitWord({x,y})}else T.cur.push({x,y,t,ll:r.ll,raw:r.best,post:r.post});
  render();
}
function commitWord(space){
  if(T.cur.length){const d=decode(T.cur);const w={start:T.text.length,touches:T.cur,word:d.word,raw:d.raw,conf:d.conf,edited:false,space:space||null};
    T.text+=d.word;T.words.push(w);T.cur=[];
    const prev=T.words[T.words.length-2];if(prev&&!prev.learnedDone){prev.learnedDone=true;learnWord(prev)}
  }
  if(space)T.text+=' ';
}
function flushLearning(){const w=T.words[T.words.length-1];if(w&&!w.learnedDone){w.learnedDone=true;learnWord(w)}saveLearned()}
function backspace(t){
  stamp(t);T.bks++;
  if(T.cur.length){T.cur.pop();return}
  if(!T.text.length)return;
  const last=T.words[T.words.length-1];
  if(T.text.endsWith(' ')&&last&&last.start+last.word.length===T.text.length-1){
    T.text=T.text.slice(0,-1);T.words.pop();T.text=T.text.slice(0,last.start);
    T.cur=last.touches.map((c,i)=>Object.assign({},c,{raw:last.word[i]??c.raw}));return;
  }
  T.text=T.text.slice(0,-1);
  if(last&&T.text.length<last.start+last.word.length){last.edited=true;if(T.text.length<=last.start)T.words.pop()}
}
function typedString(){return T.text+T.cur.map(c=>c.raw).join('')}

// ---------- 指标 ----------
function msd(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function scorePhrase(P,Tx,t0,t1,ks,bks){
  const S=(t1-t0)/1000;const wpm=Tx.length>1&&S>0?((Tx.length-1)/S)*60/5:0;
  const uer=msd(P,Tx)/Math.max(P.length,Tx.length,1);return {wpm,uer,kspc:ks/Math.max(Tx.length,1),bks};
}

const COND_NAMES={'mapped-decode':'个性化映射 + 解码','mapped-raw':'个性化映射（无解码）','native':'iPad 系统键盘'};
const CAL_SENT=['the quick brown fox jumps over the lazy dog','pack my box with five dozen liquor jugs','sphinx of black quartz judge my vow','hello world guten tag ni hao'];

let mode='home';
const cal={step:null,corners:null,home:null,thumbs:[],samples:[],si:0,ci:0,geom:null,marks:[]};
const test={queue:[],idx:0,phrase:'',done:[]};
const drill={results:[]};

function setMode(m){mode=m;$('#native').hidden=true;$('#btnAux').hidden=true;resetTyping();
  if(m==='practice'){if(!needProfile())return;model.off={L:[0,0],R:[0,0]}}
  if(m==='test'){if(settings.cond!=='native'&&!needProfile())return;startTest()}
  if(m==='drill'){if(!needProfile())return}

function needProfile(){if(model)return true;toast('还没有校准档案，先做一次校准');setMode('cal');return false}

// ---------- 触摸处理 ----------
const active=new Map();
const flashes=[];
let chordTimer=null;
const isUI=e=>e.target&&e.target.closest&&e.target.closest('.ui');
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!isUI(e))e.preventDefault()},{passive:false});
document.addEventListener('touchstart',e=>{
  if(isUI(e))return;e.preventDefault();if(!$('#sheet').hidden)return;
  const now=performance.now();
  for(const t of e.changedTouches)active.set(t.identifier,{x0:t.clientX,y0:t.clientY,x:t.clientX,y:t.clientY,t0:now,used:false});
  if(active.size>=4){clearTimeout(chordTimer);chordTimer=setTimeout(checkChord,mode==='cal'?500:220)}
  render();
},{passive:false});
document.addEventListener('touchmove',e=>{for(const t of e.changedTouches){const a=active.get(t.identifier);if(a){a.x=t.clientX;a.y=t.clientY}}},{passive:false});
const endTouch=e=>{
  if(isUI(e)&&![...e.changedTouches].some(t=>active.has(t.identifier)))return;
  const now=performance.now();
  for(const t of e.changedTouches){const a=active.get(t.identifier);if(!a)continue;active.delete(t.identifier);
    if(a.used||e.type==='touchcancel')continue;
    const dur=now-a.t0,dx=t.clientX-a.x0,dy=t.clientY-a.y0;
    if(Math.abs(dx)>40&&Math.abs(dx)>2*Math.abs(dy)&&dur<600){onSwipe(dx<0?'left':'right',now);continue}
    if(dur>settings.tapMax&&!(mode==='cal'&&cal.step==='corners'))continue;   // 停在屏幕上的手指（休息）不算按键
    if(Math.hypot(dx,dy)>25)continue;
    onTap(a.x0,a.y0,a.t0);
  }
  render();
};
document.addEventListener('touchend',endTouch,{passive:false});
document.addEventListener('touchcancel',endTouch,{passive:false});

function checkChord(){
  const pts=[...active.values()].filter(a=>!a.used&&Math.hypot(a.x-a.x0,a.y-a.y0)<20);
  const need=(mode==='cal'&&cal.step==='home')||mode==='drill'?8:4;
  if(pts.length<need)return;
  pts.forEach(a=>a.used=true);onChord(pts.map(a=>[a.x0,a.y0]));
}

function onChord(points){
  if(mode==='cal'){
    if(cal.step==='home'){
      if(points.length>8)points=[...points].sort((a,b)=>a[1]-b[1]).slice(0,8);
      cal.home=homeFromPoints(points);const g=geomModel(cal.home,[]);
      if(g.pitch<25||g.pitch>140){toast('八个点间距不太像双手，请重放');cal.home=null;return}
      cal.geom=g;cal.step='thumb';toast('已记录 home row');
    }else if(cal.step==='type'&&cal.geom){
      // 校准中途手离开又放回：平移几何模型
      calReanchor(points);
    }
    render();return;
  }
  if(!model)return;
  if(mode==='drill'){drillRecord(points);return}
  if(mode==='practice'||mode==='test'){const r=reanchor(points);const s=Object.entries(r).map(([h,v])=>(h==='L'?'左':'右')+'手 '+fmt(mm(v.shift))+'mm').join('，');if(s)toast('已重新对位：'+s)}
}
function calReanchor(points){
  const g=cal.geom;const mid=(cal.home.f[0]+cal.home.j[0])/2+(cal.off?(cal.off.L[0]+cal.off.R[0])/2:0);
  cal.off=cal.off||{L:[0,0],R:[0,0]};
  for(const h of ['L','R']){let grp=points.filter(p=>h==='L'?p[0]<mid:p[0]>=mid);if(grp.length>4)grp=[...grp].sort((a,b)=>a[1]-b[1]).slice(0,4);if(grp.length!==4)continue;
    const hs=(h==='L'?HOME_L:HOME_R).map(c=>cal.home[c]);cal.off[h]=[avg(grp,0)-avg(hs,0),avg(grp,1)-avg(hs,1)]}
  toast('已重新对位');
}

function onTap(x,y,t){
  if(mode==='cal')return calTap(x,y);
  if(mode==='practice'||(mode==='test'&&settings.cond!=='native'))return typeTap(x,y,t);
}
function onSwipe(dir,t){
  if(mode==='cal'&&cal.step==='type'){if(dir==='left')calUndo();return}
  if(mode==='practice'){if(dir==='left')backspace(t);else{commitWord(null);T.text+='\n';flushLearning()}render();return}
  if(mode==='test'&&settings.cond!=='native'){if(dir==='left'){backspace(t);render()}else submitPhrase();return}
}

// ---------- 校准 ----------
function calTap(x,y){
  const W=innerWidth,H=innerHeight;
  if(cal.step==='corners'){
    const nearL=x<W*0.25&&y>H*0.7,nearR=x>W*0.75&&y>H*0.7;
    cal.corners=cal.corners||{};if(nearL)cal.corners.L=[x,y];if(nearR)cal.corners.R=[x,y];
    if(!nearL&&!nearR)toast('请摸屏幕左下角和右下角');
    if(cal.corners.L&&cal.corners.R){cal.step='home';toast('好，现在把八个手指放到 home row')}
    render();return;
  }
  if(cal.step==='thumb'){
    const midY=avg(Object.values(cal.home),1);if(y<midY+0.6*cal.geom.pitch){toast('这次落点在 home row 上方了，用拇指敲下面');return}
    cal.thumbs.push([x,y]);flashes.push({x,y,ch:'␣',t:performance.now()});
    if(cal.thumbs.length>=6){cal.geom=geomModel(cal.home,cal.thumbs);cal.step='type';cal.si=0;cal.ci=0}
    render();return;
  }
  if(cal.step==='type'){
    const s=CAL_SENT[cal.si];const ch=s[cal.ci];
    const o=cal.off||{L:[0,0],R:[0,0]};
    const k=cal.geom.keys.find(k=>k.ch===ch)||cal.geom.keys.find(k=>k.ch===' ');
    // 样本存成“相对校准时 home row 的位置”，抵消中途重新对位
    const sx=x-o[k.hand][0],sy=y-o[k.hand][1];
    cal.samples.push({ch,x:sx,y:sy});
    const near=cal.geom.keys.filter(q=>q.ch!==' '||true).map(q=>[q,Math.hypot(q.mu[0]-sx,q.mu[1]-sy)]).sort((a,b)=>a[1]-b[1])[0][0];
    cal.marks.push(near.ch===ch);
    flashes.push({x,y,ch:ch===' '?'␣':ch,t:performance.now()});
    cal.ci++;
    if(cal.ci>=s.length){cal.si++;cal.ci=0;cal.marks=[];
      if(cal.si>=CAL_SENT.length)finishCal();}
    render();
  }
}
function calUndo(){if(cal.step!=='type')return;if(cal.ci===0)return;cal.ci--;cal.samples.pop();cal.marks.pop();render()}
function calRedoSentence(){if(cal.step!=='type')return;cal.samples.splice(cal.samples.length-cal.ci,cal.ci);cal.ci=0;cal.marks=[];render()}
function finishCal(){
  const fit=fitProfile(cal.home,cal.thumbs,cal.samples);
  profile={v:1,w:innerWidth,h:innerHeight,created:Date.now(),home:cal.home,corners:cal.corners,pitch:fit.pitch,keys:fit.keys,sigma:fit.sigma,used:fit.used,dropped:fit.dropped,thumbs:cal.thumbs};
  store.set('tkb.profile.'+orientKey(),profile);model=buildModel(profile);
  cal.step='done';render();openSummary(fit);
}
function anchorText(pr){
  const H=innerHeight;const a=pr.home.a,j=pr.home.j;
  return `左手 A 离左边缘约 ${fmt(mm(a[0]),0)} mm、离底边约 ${fmt(mm(H-a[1]),0)} mm；右手 J 离右边缘约 ${fmt(mm(innerWidth-pr.home[';'][0]),0)} mm（按 ; 计）、离底边约 ${fmt(mm(H-j[1]),0)} mm。`;
}
function openSummary(fit){
  openSheet(`<h1>校准完成</h1>
  <p>键距约 ${fmt(mm(fit.pitch))} mm，落点散布 σ 约 ${fmt(mm(fit.sigma))} mm（约 ${fmt(fit.sigma/fit.pitch*100,0)}% 键距）。用了 ${fit.used} 个落点，丢掉 ${fit.dropped} 个离谱的点。</p>
  <p>${anchorText(profile)}以后每次开始前先摸一下底边两角，再把八指放下，系统会按这次的落点重新对位。</p>
  <div class="row"><button class="primary" data-go="practice">去自由练习</button><button data-go="drill">练习找位置</button><button data-go="test">开始测试</button></div>`);
}

// ---------- 测试 ----------
function startTest(){test.queue=shuffle([...PHRASES]);test.idx=0;nextPhrase()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextPhrase(){test.phrase=test.queue[test.idx%test.queue.length];resetTyping();
  if(settings.cond==='native'){$('#native').hidden=false;const ni=$('#nativeInput');ni.value='';native.first=null;native.bks=0;native.ks=0}
  else if(model)model.off=model.off||{L:[0,0],R:[0,0]};
  render()}
function submitPhrase(){
  if(T.first===null){toast('先打这一句');return}
  commitWord(null);flushLearning();
  const typed=typedString().trim();const s=scorePhrase(test.phrase,typed,T.first,T.last,T.ks,T.bks);
  logPhrase({cond:settings.cond,phrase:test.phrase,typed,...s,follow:settings.follow,taps:T.taps});
  test.idx++;nextPhrase();
}
const native={first:null,bks:0,ks:0};
$('#nativeInput').addEventListener('beforeinput',e=>{const now=performance.now();if(native.first===null)native.first=now;native.last=now;native.ks++;if(e.inputType==='deleteContentBackward')native.bks++});
$('#nativeInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitNative()}});
$('#nativeSubmit').addEventListener('click',submitNative);
function submitNative(){const v=$('#nativeInput').value.trim().toLowerCase();if(native.first===null||!v){toast('先打这一句');return}
  const s=scorePhrase(test.phrase,v,native.first,native.last,native.ks,native.bks);logPhrase({cond:'native',phrase:test.phrase,typed:v,...s});test.idx++;nextPhrase();$('#nativeInput').focus()}
function logPhrase(r){const log=store.get('tkb.log',[]);r.ts=Date.now();log.push(r);store.set('tkb.log',log);
  toast(`${fmt(r.wpm)} WPM · 错误率 ${fmt(r.uer*100)}%`)}

// ---------- 找位置练习 ----------
function drillRecord(points){
  if(points.length>8)points=[...points].sort((a,b)=>a[1]-b[1]).slice(0,8);
  const h=homeFromPoints(points);const keys=[...HOME_L,...HOME_R];
  let sum=0;keys.forEach(c=>sum+=Math.hypot(h[c][0]-profile.home[c][0],h[c][1]-profile.home[c][1]));
  const cen=hand=>{const ks=hand==='L'?HOME_L:HOME_R;return [avg(ks.map(c=>h[c]),0)-avg(ks.map(c=>profile.home[c]),0),avg(ks.map(c=>h[c]),1)-avg(ks.map(c=>profile.home[c]),1)]};
  const r={ts:Date.now(),mean:mm(sum/8),L:cen('L').map(mm),R:cen('R').map(mm)};
  drill.results.unshift(r);const all=store.get('tkb.drills',[]);all.push(r);store.set('tkb.drills',all);
  reanchor(points);
  toast(`平均偏差 ${fmt(r.mean)} mm`);render();
}

// ---------- 绘制 ----------
const cv=$('#cv'),ctx=cv.getContext('2d');let DPR=1;
function resize(){DPR=window.devicePixelRatio||1;cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;const o=profile;loadProfile();if(o!==profile)render();render()}
addEventListener('resize',resize);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let raf=0;function render(){if(!raf)raf=requestAnimationFrame(draw);renderBar()}
function draw(){raf=0;const now=performance.now();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
  const fg=css('--key'),acc=css('--accent'),muted=css('--muted'),warn=css('--warn');
  ctx.textAlign='center';ctx.textBaseline='middle';
  // 键盘轮廓
  let keys=null,off={L:[0,0],R:[0,0]};
  if(mode==='cal'&&cal.geom){keys=cal.geom.keys;off=cal.off||off}
  else if(model&&mode!=='home'&&!(mode==='test'&&settings.cond==='native')){keys=model.keys;off=model.off}
  const alpha={clear:.75,faint:.16,hidden:0}[settings.vis];
  if(keys&&(alpha>0||mode==='cal')){const p=(mode==='cal'?cal.geom.pitch:model.pitch);
    ctx.globalAlpha=mode==='cal'?Math.max(alpha,.35):alpha;ctx.strokeStyle=fg;ctx.fillStyle=fg;ctx.lineWidth=1.2;ctx.font=`${Math.round(p*0.32)}px ${css('--f-mono')}`;
    for(const k of keys){const x=k.mu[0]+off[k.hand][0],y=k.mu[1]+off[k.hand][1];
      if(k.ch===' '){const sx=Math.sqrt(k.cov[0]),sy=Math.sqrt(k.cov[2]);ctx.beginPath();ctx.ellipse(x,y,sx*1.2,sy*1.2,0,0,7);ctx.stroke();ctx.fillText('space',x,y);continue}
      ctx.beginPath();ctx.arc(x,y,p*0.42,0,7);ctx.stroke();ctx.fillText(k.ch.toUpperCase(),x,y)}
    // 当前期望键
    if(mode==='cal'&&cal.step==='type'){const ch=CAL_SENT[cal.si][cal.ci];const k=keys.find(k=>k.ch===ch);if(k){ctx.globalAlpha=.9;ctx.strokeStyle=acc;ctx.lineWidth=3;ctx.beginPath();
      const x=k.mu[0]+off[k.hand][0],y=k.mu[1]+off[k.hand][1];if(ch===' ')ctx.ellipse(x,y,Math.sqrt(k.cov[0])*1.2,Math.sqrt(k.cov[2])*1.2,0,0,7);else ctx.arc(x,y,p*0.46,0,7);ctx.stroke()}}
    ctx.globalAlpha=1}
  // 校准引导
  if(mode==='cal'&&cal.step==='corners'){ctx.strokeStyle=acc;ctx.lineWidth=4;const W=innerWidth,H=innerHeight,s=70;
    for(const [cx,dir] of [[0,1],[W,-1]]){ctx.beginPath();ctx.moveTo(cx+dir*s,H-4);ctx.lineTo(cx+dir*4,H-4);ctx.lineTo(cx+dir*4,H-s);ctx.stroke()}
    if(cal.corners)for(const c of Object.values(cal.corners)){ctx.fillStyle=acc;ctx.beginPath();ctx.arc(c[0],c[1],10,0,7);ctx.fill()}}
  if(mode==='drill'&&profile){ctx.globalAlpha=.5;ctx.strokeStyle=acc;ctx.setLineDash([4,4]);ctx.lineWidth=1.5;
    for(const c of [...HOME_L,...HOME_R]){const p=profile.home[c];ctx.beginPath();ctx.arc(p[0],p[1],model.pitch*0.42,0,7);ctx.stroke()}ctx.setLineDash([]);ctx.globalAlpha=1}
  // 正按着的手指
  for(const a of active.values()){ctx.fillStyle=a.used?acc:muted;ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(a.x,a.y,22,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  // 刚才的落点
  for(let i=flashes.length-1;i>=0;i--){const f=flashes[i];const age=now-f.t;if(age>600){flashes.splice(i,1);continue}
    ctx.globalAlpha=1-age/600;ctx.fillStyle=acc;ctx.beginPath();ctx.arc(f.x,f.y,6,0,7);ctx.fill();
    if(settings.vis!=='hidden'||mode==='cal'){ctx.font=`600 22px ${css('--f-mono')}`;ctx.fillText(f.ch===' '?'␣':f.ch,f.x,f.y-26)}}
  ctx.globalAlpha=1;
  if(flashes.length||active.size)raf=requestAnimationFrame(draw);
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderBar(){
  const ml=$('#modeLabel'),pr=$('#prompt'),out=$('#out'),st=$('#stats'),aux=$('#btnAux');
  out.innerHTML='';st.textContent='';pr.innerHTML='';aux.hidden=true;
  if(mode==='home'){ml.textContent='盲打触控键盘';pr.textContent=model?'已有校准档案。点“菜单”选择练习或测试。':'先做一次校准：点“菜单” → 校准。';return}
  if(mode==='cal'){ml.textContent='校准 · '+{corners:'1/4 摸边角',home:'2/4 放手',thumb:'3/4 拇指',type:'4/4 打句子',done:'完成'}[cal.step];
    if(cal.step==='corners')pr.textContent='闭上眼也行：左手摸屏幕左下角，右手摸右下角，各点一下。';
    if(cal.step==='home')pr.textContent='从角落滑回来，八个手指自然放在你觉得是 A S D F / J K L ; 的位置，一起按住约半秒。';
    if(cal.step==='thumb')pr.textContent=`用大拇指在你习惯敲空格的地方敲 6 下（还差 ${6-cal.thumbs.length} 下）。`;
    if(cal.step==='type'){const s=CAL_SENT[cal.si];let h='';for(let i=0;i<s.length;i++){const c=s[i]===' '?'␣':esc(s[i]);if(i<cal.ci)h+=`<span class="${cal.marks[i]?'ok':'miss'}">${c}</span>`;else if(i===cal.ci)h+=`<span class="cur">${c}</span>`;else h+=c}
      pr.innerHTML=h;st.textContent=`第 ${cal.si+1}/${CAL_SENT.length} 句 · 不用看屏幕，按你觉得对的位置打，每敲一下算下一个字母 · 左滑撤销一下 · 手离开后八指按住可重新对位 · 绿=落在预测键上，橙=偏到别的键（照样记录）`;
      aux.hidden=false;aux.textContent='重打这句';aux.onclick=calRedoSentence}
    return}
  if(mode==='practice'||mode==='test'){
    ml.textContent=mode==='practice'?'自由练习 · '+(settings.decode?'解码开':'解码关'):'测试 · '+COND_NAMES[settings.cond]+' · 第 '+(test.idx+1)+' 句';
    if(mode==='test')pr.textContent=test.phrase;
    if(!(mode==='test'&&settings.cond==='native')){
      const raw=T.cur.map(c=>c.raw).join('');out.innerHTML=esc(T.text)+(raw?`<span class="raw">${esc(raw)}</span>`:'')+'<span class="caret"></span>';
      const lw=T.words[T.words.length-1];
      st.textContent=`拇指=空格 · 左滑=删除 · 右滑=${mode==='test'?'提交这句':'换行'} · 八指按住=重新对位`+(lw&&lw.word!==lw.raw?` · 上个词 ${lw.raw}→${lw.word}`:'')+(model?` · 偏移 L(${fmt(mm(model.off.L[0]),0)},${fmt(mm(model.off.L[1]),0)}) R(${fmt(mm(model.off.R[0]),0)},${fmt(mm(model.off.R[1]),0)}) mm`:'');
    }else st.textContent='对照组：用 iPad 自带键盘打上面这句，回车提交。';
    if(mode==='test'){aux.hidden=false;aux.textContent='跳过这句';aux.onclick=()=>{test.idx++;nextPhrase()}}
    return}
  if(mode==='drill'){ml.textContent='找位置练习';pr.textContent='手离开屏幕 → 摸底部两个角 → 不看屏幕把八指放回 home row 按住。虚线圈是校准时的位置。';
    st.textContent=drill.results.slice(0,6).map((r,i)=>`#${drill.results.length-i} 平均 ${fmt(r.mean)}mm · 左手偏(${fmt(r.L[0],0)},${fmt(r.L[1],0)}) 右手偏(${fmt(r.R[0],0)},${fmt(r.R[1],0)})`).join('   ')||'还没有记录';return}
}

// ---------- 菜单 / 数据 ----------
function openSheet(html){$('#sheetCard').innerHTML=html;$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go)setMode(b.dataset.go);
  if(b.dataset.set){const [k,v]=b.dataset.set.split('=');settings[k]=v==='true'?true:v==='false'?false:isNaN(+v)?v:+v;saveSettings();openMenu();render()}
  if(b.dataset.act)ACTS[b.dataset.act](b)});
const seg=(k,opts)=>`<span class="seg">${opts.map(([v,l])=>`<button data-set="${k}=${v}" class="${String(settings[k])===String(v)?'on':''}">${l}</button>`).join('')}</span>`;
function openMenu(){
  openSheet(`<h1>盲打触控键盘</h1>
  <p>用屏幕边缘当物理锚点，按你自己的落点建键盘，打字时只用有把握的词慢慢跟随。${profile?'当前方向已有校准（'+new Date(profile.created).toLocaleString()+'）。':'当前方向还没有校准。'}</p>
  <div class="grid">
    <button class="tile" data-go="cal"><b>校准</b><span>摸边角 → 八指放下 → 拇指 → 打 4 句全字母句，约 2 分钟</span></button>
    <button class="tile" data-go="practice"><b>自由练习</b><span>随便打，看映射和跟随效果</span></button>
    <button class="tile" data-go="drill"><b>找位置练习</b><span>摸角落后放手，量手每次落下偏多少毫米</span></button>
    <button class="tile" data-go="test"><b>测试</b><span>抄写短句，记录 WPM 和错误率</span></button>
    <button class="tile" data-act="data"><b>数据</b><span>按条件对比，导出 JSON</span></button>
  </div>
  <div><h2>设置</h2><div style="display:grid;gap:10px">
    <div class="row"><span class="lbl">测试条件</span>${seg('cond',[['mapped-decode','映射+解码'],['mapped-raw','映射无解码'],['native','系统键盘']])}</div>
    <div class="row"><span class="lbl">键盘轮廓</span>${seg('vis',[['clear','清楚'],['faint','很淡'],['hidden','隐藏']])}</div>
    <div class="row"><span class="lbl">练习时解码</span>${seg('decode',[['true','开'],['false','关']])}</div>
    <div class="row"><span class="lbl">跟随修正</span>${seg('follow',[['true','开'],['false','关']])}</div>
    <div class="row"><span class="lbl">按键最长</span>${seg('tapMax',[[200,'200ms'],[300,'300ms'],[450,'450ms']])}<span class="note">按住超过这个时长算“手指休息”，不出字</span></div>
    <div class="row"><button data-act="resetLearn">清掉跟随学到的偏移</button><button data-act="resetAll">删除本方向校准</button><button data-act="theme">切换深浅色</button></div>
  </div></div>
  <p class="note">建议先在 iPad 设置 → 多任务与手势 里关掉“手势”（四五指捏合/横扫），否则八指按下会被系统抢走。横屏和竖屏各有一份校准。</p>`);
}
const ACTS={
  data(){const log=store.get('tkb.log',[]);const drills=store.get('tkb.drills',[]);
    const groups={};log.forEach(r=>{const d=new Date(r.ts);const day=`${d.getMonth()+1}/${d.getDate()}`;const k=day+'|'+r.cond;(groups[k]||(groups[k]={day,cond:r.cond,n:0,wpm:0,uer:0,kspc:0,bks:0})).n++;const g=groups[k];g.wpm+=r.wpm;g.uer+=r.uer;g.kspc+=r.kspc;g.bks+=r.bks});
    const rows=Object.values(groups).map(g=>`<tr><td>${g.day}</td><td style="text-align:left">${COND_NAMES[g.cond]||g.cond}</td><td>${g.n}</td><td>${fmt(g.wpm/g.n)}</td><td>${fmt(g.uer/g.n*100)}%</td><td>${fmt(g.kspc/g.n,2)}</td><td>${fmt(g.bks/g.n)}</td></tr>`).join('');
    const dr=drills.length?`平均 ${fmt(drills.reduce((s,r)=>s+r.mean,0)/drills.length)} mm（${drills.length} 次，最近 5 次 ${fmt(drills.slice(-5).reduce((s,r)=>s+r.mean,0)/Math.min(5,drills.length))} mm）`:'还没有';
    const dump=JSON.stringify({profile,log,drills,ua:navigator.userAgent,screen:[innerWidth,innerHeight,devicePixelRatio]});
    openSheet(`<h1>数据</h1>
    <div class="tablewrap"><table><thead><tr><th>日期</th><th style="text-align:left">条件</th><th>句数</th><th>WPM</th><th>未纠正错误率</th><th>KSPC</th><th>删除/句</th></tr></thead><tbody>${rows||'<tr><td colspan="7">还没有测试记录</td></tr>'}</tbody></table></div>
    <p>找位置练习：${dr}</p>
    <p class="note">WPM =（字符数−1）/ 秒 × 60 / 5；未纠正错误率 = 最小编辑距离 / 较长长度；KSPC = 每个最终字符用了多少次按键（含删除）。数据只存在这台 iPad 的浏览器里。</p>
    <div class="row"><button class="primary" data-act="copy">复制全部数据（JSON）</button><button data-act="clearLog">清空测试记录</button><button data-act="menu">返回</button></div>
    <textarea class="dump" id="dump" readonly>${esc(dump)}</textarea>`)},
  copy(){const t=$('#dump');const ok=()=>toast('已复制');navigator.clipboard?.writeText(t.value).then(ok,()=>{t.select();toast('请手动全选复制')})||(t.select(),toast('请手动全选复制'))},
  clearLog(b){if(b.dataset.armed){store.set('tkb.log',[]);store.set('tkb.drills',[]);toast('已清空');ACTS.data()}else{b.dataset.armed=1;b.textContent='再点一次确认清空'}},
  menu(){openMenu()},
  resetLearn(){if(profile){delete profile.learned;store.set('tkb.profile.'+orientKey(),profile);model=buildModel(profile);toast('已恢复到校准时的映射')}},
  resetAll(b){if(b.dataset.armed){try{localStorage.removeItem('tkb.profile.'+orientKey())}catch(e){}profile=null;model=null;toast('已删除');setMode('home')}else{b.dataset.armed=1;b.textContent='再点一次确认删除'}},
  theme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('tkb.theme',r.dataset.theme);render()}
};
$('#btnMenu').addEventListener('click',()=>{if($('#sheet').hidden)openMenu();else closeSheet()});
$('#btnFs').addEventListener('click',()=>{const d=document.documentElement;const f=d.requestFullscreen||d.webkitRequestFullscreen;if(!f){toast('这个环境不支持全屏，可以“添加到主屏幕”打开');return}try{const p=f.call(d);p&&p.catch&&p.catch(()=>toast('全屏被拒绝'))}catch(e){toast('全屏被拒绝')}});

// ---------- 启动 ----------
(function boot(){const th=store.get('tkb.theme',null);if(th)document.documentElement.dataset.theme=th;resize();if(!model){mode='home';openMenu()}render();
  window.__tkb={settings,cal,T,get model(){return model},get profile(){return profile},decode,classify,setMode,fitProfile,geomModel,test,stats};})();
</script>
