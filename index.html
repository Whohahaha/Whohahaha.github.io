<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nathan</title>
<meta name="description" content="Nathan — Medical Engineering, FAU Erlangen-Nürnberg. Projects and prototypes.">
<meta property="og:title" content="Nathan">
<meta property="og:description" content="Projects and prototypes · 项目与原型 · Projekte und Prototypen">
<meta property="og:url" content="https://whohahaha.live/">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1418" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7d84'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EHX%3C/text%3E%3C/svg%3E">
<style>
/* Same tokens as /touch-keyboard/ so the site reads as one place. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#16202a; --muted:#5b6876; --line:#d7dde4;
  --accent:#0b7d84; --accent-ink:#ffffff; --accent-soft:rgba(11,125,132,.10);
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#141b20; --fg:#e4eaef; --muted:#93a1ad; --line:#2a353e;
  --accent:#34b3b9; --accent-ink:#06191a; --accent-soft:rgba(52,179,185,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#141b20; --fg:#e4eaef; --muted:#93a1ad; --line:#2a353e;
  --accent:#34b3b9; --accent-ink:#06191a; --accent-soft:rgba(52,179,185,.12); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);line-height:1.6;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1040px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left)) 0 max(20px,env(safe-area-inset-right))}

/* top bar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0}
.mark{font-family:var(--f-mono);font-size:13px;letter-spacing:.04em;color:var(--muted);text-decoration:none}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{all:unset;cursor:pointer;font-size:13px;padding:4px 11px;border-radius:999px;color:var(--muted);min-width:22px;text-align:center}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* intro */
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 8px}
.intro{padding:24px 0 40px}
.intro h1{font-size:clamp(38px,6vw,52px);line-height:1.05;letter-spacing:-.025em;margin:0 0 14px;font-weight:700}
.intro p{font-size:18px;color:var(--muted);margin:0;max-width:34em;text-wrap:pretty}
.links{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;font-size:15px}
.links a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
.links a:hover{border-color:var(--accent);color:var(--accent)}

/* projects */
section.projects h2{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.grid{display:grid;gap:20px;grid-template-columns:1fr}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  text-decoration:none;color:inherit;transition:border-color .15s, transform .15s, box-shadow .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 30px -20px rgba(0,0,0,.35)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.art{background:var(--accent-soft);display:block;width:100%;height:140px}
.art svg{display:block;width:100%;height:100%}
.body{padding:20px 24px 22px;display:flex;flex-direction:column;flex:1}
.body h3{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--muted);margin:0 0 10px}
.body p.desc{margin:0 0 16px;color:var(--muted);line-height:1.6;text-wrap:pretty;flex:1}
.go{font-size:15px;font-weight:600;color:var(--accent)}
@media (min-width:900px){
  main{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:64px;align-items:center;align-content:center}
  .intro{padding:0 0 28px}
  .intro p{font-size:17px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .toProjects{display:none}
}

footer{padding:28px 0 calc(24px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted)}
footer a{text-decoration:none;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="/">whohahaha.live</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-set-lang="zh" lang="zh-CN">中</button>
      <button type="button" data-set-lang="en" lang="en">EN</button>
      <button type="button" data-set-lang="de" lang="de">DE</button>
    </div>
  </header>

  <main>
    <section class="intro">
      <h1>Nathan</h1>
      <p data-i18n="intro"></p>
      <nav class="links">
        <a class="toProjects" href="#projects" data-i18n="toProjects"></a>
        <a href="https://github.com/Whohahaha" rel="me">GitHub ↗</a>
      </nav>
    </section>

    <section class="projects" id="projects">
      <h2 data-i18n="projects"></h2>
      <div class="grid">
      <a class="card" href="/touch-keyboard/">
        <span class="art" aria-hidden="true">
          <!-- Per-key Gaussians (ellipses) with a few touch points: the idea behind the keyboard. -->
          <svg viewBox="-30 28 320 150" preserveAspectRatio="xMidYMid meet" id="kbArt"></svg>
        </span>
        <div class="body">
          <h3 data-i18n="kb.title"></h3>
          <p class="meta" data-i18n="kb.meta"></p>
          <p class="desc" data-i18n="kb.desc"></p>
          <span class="go"><span data-i18n="open"></span> →</span>
        </div>
      </a>

      <a class="card" href="/studon-sync/">
        <span class="art" aria-hidden="true">
          <!-- A course folder tree on the left syncing into a local folder on the right. -->
          <svg viewBox="-20 38 300 130" preserveAspectRatio="xMidYMid meet">
            <g fill="var(--accent)" fill-opacity=".14" stroke="var(--accent)" stroke-opacity=".45">
              <rect x="34" y="50" width="62" height="16" rx="4"/>
              <rect x="50" y="76" width="54" height="12" rx="3"/>
              <rect x="50" y="96" width="54" height="12" rx="3"/>
              <rect x="34" y="118" width="62" height="16" rx="4"/>
              <rect x="50" y="144" width="54" height="12" rx="3"/>
              <path d="M160 72h22l8 8h36v66h-66z"/>
            </g>
            <g fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M116 92h28m-7-7 7 7-7 7"/>
              <path d="M116 128h28m-7-7 7 7-7 7"/>
            </g>
            <g fill="var(--accent)"><circle cx="178" cy="104" r="2.6"/><circle cx="192" cy="104" r="2.6"/><circle cx="206" cy="104" r="2.6"/>
              <circle cx="178" cy="120" r="2.6"/><circle cx="192" cy="120" r="2.6"/></g>
          </svg>
        </span>
        <div class="body">
          <h3 data-i18n="ss.title"></h3>
          <p class="meta" data-i18n="ss.meta"></p>
          <p class="desc" data-i18n="ss.desc"></p>
          <span class="go"><span data-i18n="more"></span> →</span>
        </div>
      </a>
      </div>
    </section>
  </main>

  <footer>© 2026 Nathan · <a href="https://github.com/Whohahaha">github.com/Whohahaha</a></footer>
</div>

<script>
const T = {
  zh: {
    _lang: "zh-CN",
    intro: "FAU 医学工程硕士在读。这里放我做的小工具和原型。",
    toProjects: "看项目 ↓",
    projects: "项目",
    "kb.title": "盲打触控键盘",
    "kb.meta": "iPad 网页原型",
    "kb.desc": "用屏幕边缘做触觉锚点，按你自己手指的落点生成键盘。",
    "kb.t1": "原型", "kb.t2": "每键高斯模型", "kb.t3": "词级解码",
    "ss.title": "StudOn Sync",
    "ss.meta": "macOS 桌面 App · 开源",
    "ss.desc": "把 StudOn 课程文件自动同步到自己电脑，不会覆盖你的笔记。",
    "ss.t1": "开源 · MIT", "ss.t2": "FAU SSO + TOTP", "ss.t3": "增量同步",
    more: "介绍与下载",
    open: "打开"
  },
  en: {
    _lang: "en",
    intro: "Medical Engineering student at FAU. Small tools and prototypes I build.",
    toProjects: "See projects ↓",
    projects: "Projects",
    "kb.title": "Blind-typing touch keyboard",
    "kb.meta": "iPad web prototype",
    "kb.desc": "Uses the screen edges as tactile anchors and builds the keyboard from where your own fingers land.",
    "kb.t1": "Prototype", "kb.t2": "Per-key Gaussians", "kb.t3": "Word-level decoding",
    "ss.title": "StudOn Sync",
    "ss.meta": "macOS desktop app · open source",
    "ss.desc": "Keeps your StudOn course files in sync on your own computer, without overwriting your notes.",
    "ss.t1": "Open source · MIT", "ss.t2": "FAU SSO + TOTP", "ss.t3": "Incremental sync",
    more: "Details & download",
    open: "Open"
  },
  de: {
    _lang: "de",
    intro: "Medizintechnik-Student an der FAU. Kleine Werkzeuge und Prototypen, die ich baue.",
    toProjects: "Zu den Projekten ↓",
    projects: "Projekte",
    "kb.title": "Blindschreib-Touch-Tastatur",
    "kb.meta": "iPad-Web-Prototyp",
    "kb.desc": "Nutzt die Bildschirmkanten als tastbare Anker und baut die Tastatur aus deinen eigenen Fingerpositionen.",
    "kb.t1": "Prototyp", "kb.t2": "Gauß-Modell pro Taste", "kb.t3": "Wortbasierte Dekodierung",
    "ss.title": "StudOn Sync",
    "ss.meta": "macOS-Desktop-App · Open Source",
    "ss.desc": "Synchronisiert deine StudOn-Kursdateien auf den eigenen Rechner, ohne deine Notizen zu überschreiben.",
    "ss.t1": "Open Source · MIT", "ss.t2": "FAU SSO + TOTP", "ss.t3": "Inkrementeller Sync",
    more: "Details & Download",
    open: "Öffnen"
  }
};

function pickInitial(){
  try{ const s = localStorage.getItem("lang"); if (T[s]) return s; }catch(e){}
  const q = new URLSearchParams(location.search).get("lang"); if (T[q]) return q;
  for (const l of (navigator.languages || [navigator.language || ""])){
    const k = l.slice(0,2).toLowerCase(); if (T[k]) return k;
  }
  return "en";
}
function setLang(k, save){
  const d = T[k];
  document.documentElement.lang = d._lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = d[el.dataset.i18n]; });
  document.querySelectorAll("[data-set-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.setLang === k));
  if (save){ try{ localStorage.setItem("lang", k); }catch(e){} }
}
document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.setLang, true)));
setLang(pickInitial(), false);

/* Card art: QWERTY rows of slightly skewed key ellipses + touch points */
(function(){
  const svg = document.getElementById("kbArt"), NS = "http://www.w3.org/2000/svg";
  const rows = [10, 9, 7], kw = 24, kh = 30;
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const g = document.createElementNS(NS, "g");
  g.setAttribute("transform", "translate(10 48) rotate(-4 130 50)");
  rows.forEach((n, r) => {
    const x0 = r * 9 + (10 - n) * kw / 2 * (r === 2 ? 0.6 : 0);
    for (let i = 0; i < n; i++){
      const cx = x0 + i * kw + 12 + (rnd() - .5) * 4, cy = r * kh + 15 + (rnd() - .5) * 4;
      const e = document.createElementNS(NS, "ellipse");
      e.setAttribute("cx", cx); e.setAttribute("cy", cy);
      e.setAttribute("rx", 8 + rnd() * 3); e.setAttribute("ry", 11 + rnd() * 3);
      e.setAttribute("transform", `rotate(${(rnd() - .5) * 30} ${cx} ${cy})`);
      e.setAttribute("fill", "var(--accent)"); e.setAttribute("fill-opacity", ".14");
      e.setAttribute("stroke", "var(--accent)"); e.setAttribute("stroke-opacity", ".45");
      g.appendChild(e);
      if (rnd() < .45){
        const d = document.createElementNS(NS, "circle");
        d.setAttribute("cx", cx + (rnd() - .5) * 8); d.setAttribute("cy", cy + (rnd() - .5) * 10);
        d.setAttribute("r", 2.2); d.setAttribute("fill", "var(--accent)");
        g.appendChild(d);
      }
    }
  });
  const sp = document.createElementNS(NS, "rect");
  sp.setAttribute("x", 70); sp.setAttribute("y", 3 * kh + 4); sp.setAttribute("width", 110); sp.setAttribute("height", 18);
  sp.setAttribute("rx", 9); sp.setAttribute("fill", "var(--accent)"); sp.setAttribute("fill-opacity", ".14");
  sp.setAttribute("stroke", "var(--accent)"); sp.setAttribute("stroke-opacity", ".45");
  g.appendChild(sp);
  svg.appendChild(g);
})();
</script>
</body>
</html>
