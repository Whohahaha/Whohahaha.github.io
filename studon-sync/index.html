<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudOn Sync · Nathan</title>
<meta name="description" content="StudOn Sync: an unofficial desktop app that keeps your FAU StudOn course files in sync with a folder on your own computer.">
<meta property="og:title" content="StudOn Sync">
<meta property="og:description" content="Sync your FAU StudOn course files to your own computer · 把 StudOn 课程文件同步到自己电脑 · StudOn-Kursdateien auf den eigenen Rechner synchronisieren">
<meta property="og:url" content="https://whohahaha.live/studon-sync/">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1418" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7d84'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EHX%3C/text%3E%3C/svg%3E">
<style>
/* Same tokens as the homepage and /touch-keyboard/. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#16202a; --muted:#5b6876; --line:#d7dde4;
  --accent:#0b7d84; --accent-ink:#ffffff; --accent-soft:rgba(11,125,132,.10); --warn:#b25d00;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#141b20; --fg:#e4eaef; --muted:#93a1ad; --line:#2a353e;
  --accent:#34b3b9; --accent-ink:#06191a; --accent-soft:rgba(52,179,185,.12); --warn:#e3a14a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#141b20; --fg:#e4eaef; --muted:#93a1ad; --line:#2a353e;
  --accent:#34b3b9; --accent-ink:#06191a; --accent-soft:rgba(52,179,185,.12); --warn:#e3a14a; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left)) 0 max(20px,env(safe-area-inset-right))}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0}
.mark{font-family:var(--f-mono);font-size:13px;letter-spacing:.04em;color:var(--muted);text-decoration:none}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{all:unset;cursor:pointer;font-size:13px;padding:4px 11px;border-radius:999px;color:var(--muted);min-width:22px;text-align:center}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.intro{padding:48px 0 36px}
.intro h1{font-size:clamp(34px,6.5vw,48px);line-height:1.1;letter-spacing:-.02em;margin:0 0 14px;font-weight:700}
.intro p{font-size:18px;color:var(--muted);margin:0;max-width:34em;text-wrap:pretty}
.note{display:inline-block;margin:0 0 18px;font-size:12px;font-family:var(--f-mono);color:var(--warn);
  border:1px solid currentColor;border-radius:999px;padding:2px 10px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px;font-weight:600;
  padding:10px 18px;border-radius:10px;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:not(.primary):hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.small{font-size:13px;color:var(--muted);margin:10px 0 0}

section{padding:24px 0 8px;border-top:1px solid var(--line);margin-top:24px}
section h2{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
ul.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:640px){ul.feat{grid-template-columns:1fr 1fr}}
ul.feat li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
ul.feat b{display:block;margin-bottom:2px}
ul.feat span{color:var(--muted);font-size:15px}
ol.steps{margin:0;padding-left:1.3em}
ol.steps li{margin:0 0 10px;text-wrap:pretty}
pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;
  font-family:var(--f-mono);font-size:13px;line-height:1.5;margin:8px 0 0}
ul.rules{margin:0;padding-left:1.2em}
ul.rules li{margin:0 0 8px;text-wrap:pretty}

footer{padding:56px 0 calc(32px + env(safe-area-inset-bottom));font-size:13px;color:var(--muted)}
footer a{text-decoration:none;border-bottom:1px solid var(--line)}
</style>
</head>
<body>

        <li><b data-i18n="f3t"></b><span data-i18n="f3"></span></li>
        <li><b data-i18n="f4t"></b><span data-i18n="f4"></span></li>
      </ul>
    </section>

    <section>
      <h2 data-i18n="hStart"></h2>
      <ol class="steps">
        <li data-i18n="s1"></li>
        <li data-i18n="s2"></li>
        <li data-i18n="s3"></li>
        <li data-i18n="s4"></li>
      </ol>
      <p class="small" data-i18n="srcNote"></p>
<pre>git clone https://github.com/Whohahaha/studon-sync.git
cd studon-sync
python3 -m venv .venv
.venv/bin/pip install -e .
.venv/bin/studon-sync</pre>
    </section>

    <section>
      <h2 data-i18n="hRules"></h2>
      <ul class="rules">
        <li data-i18n="r1"></li>
        <li data-i18n="r2"></li>
        <li data-i18n="r3"></li>
        <li data-i18n="r4"></li>
      </ul>
    </section>
  </main>

  <footer>© 2026 Nathan · <a href="https://github.com/Whohahaha/studon-sync">MIT License</a> · <a href="/">whohahaha.live</a></footer>
</div>

function pickInitial(){
  try{ const s = localStorage.getItem("lang"); if (T[s]) return s; }catch(e){}
  const q = new URLSearchParams(location.search).get("lang"); if (T[q]) return q;
  for (const l of (navigator.languages || [navigator.language || ""])){
    const k = l.slice(0,2).toLowerCase(); if (T[k]) return k;
  }
  return "en";
}
function setLang(k, save){
  const d = T[k];
  document.documentElement.lang = d._lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = d[el.dataset.i18n]; });
  document.querySelectorAll("[data-set-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.setLang === k));
  if (save){ try{ localStorage.setItem("lang", k); }catch(e){} }
}
document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.setLang, true)));
setLang(pickInitial(), false);
